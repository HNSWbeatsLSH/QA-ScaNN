float:
  any:
  - base_args: ['@metric', data]
    constructor: QAScaNN
    disabled: false
    ood: true
    singularity_image: qa_scann
    module: vibe.algorithms.qa_scann
    name: qa-scann-data
    run_groups:
      L512-p1:
        args:
          num_leaves: [512]
          p: [1]
          dims_per_block: [1, 2, 4]
          alpha: [0.9]
        query_args:
          leaves_to_search: [1, 2, 4, 8, 16, 32, 64]
          reorder: [100, 200, 300, 400, 600, 800, 1000]
      L512-p2:
        args:
          num_leaves: [512]
          p: [2]
          dims_per_block: [1, 2, 4]
          alpha: [0.9]
        query_args:
          leaves_to_search: [2, 4, 8, 16, 32, 64]
          reorder: [100, 200, 300, 400, 600, 800, 1000]
      L512-p4:
        args:
          num_leaves: [512]
          p: [4]
          dims_per_block: [1, 2, 4]
          alpha: [0.9]
        query_args:
          leaves_to_search: [4, 8, 16, 32, 64]
          reorder: [100, 200, 300, 400, 600, 800, 1000]
      L1024-p1:
        args:
          num_leaves: [1024]
          p: [1]
          dims_per_block: [1, 2, 4]
          alpha: [0.9]
        query_args:
          leaves_to_search: [1, 2, 4, 8, 16, 32, 64, 128]
          reorder: [100, 200, 300, 400, 600, 800, 1000]
      L1024-p2:
