float:
  any:
  - base_args: ['@metric']
    constructor: QAScaNN
    disabled: false
    ood: true
    singularity_image: qa_scann
    module: vibe.algorithms.qa_scann
    name: qa-scann
    run_groups:
      qa-scann:
        args:
          p: [1, 2, 4, 8, 16]
          alpha: [0.9, 0.99]
          centroids: [data, queries]
        query_args:
          leaves_to_search: [1, 2, 3, 5, 10, 20, 50, 100, 200]
          reorder: [200, 500, 1000, 2000, 5000, 20000]
